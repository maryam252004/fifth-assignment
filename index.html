<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>fifth Assignment</title>
    <style>
        body {
            background-color: rgb(240, 229, 233);
            display: flex;
            justify-content: center;
            padding-top: 10px;
            margin: 0px;
            font-family: Arial, sans-serif;
        }

        .title {
            text-align: center;
            padding: 10px;
            color: rgb(178, 17, 17);
            margin: 15px;
        }

        /* FIX: container now has proper flex-direction: column and a fixed width */
        .container {
    display: flex;
    flex-direction: column;
    border-radius: 10px;
    padding: 60px 60px;
    width: 500px;
    gap: 20px;
        }

        label {
            font-weight: bold;
            font-family: Arial, Helvetica, sans-serif;
            margin-top: 10px;
            color: #333;
        }

        input[type="text"],
        input[type="password"] {
            padding: 8px 12px;
            margin-top: 5px;
            border: 1px solid #28786c;
            border-radius: 5px;
            width: 100%;
        }

        input[type="text"]:hover,
        input[type="password"]:hover {
            border-color: brown;
        }

        input[type="radio"],
        input[type="checkbox"] {
            margin-right: 5px;
        }

        /* FIX: option-group for gender in a row */
        .option-group {
            display: flex;
            flex-direction: row;
            gap: 15px;
            margin-top: 5px;
            align-items: center;
        }

        /* FIX: option for hobbies in a column */
        .option {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 5px;
        }

        input[type="submit"] {
            margin-top: 20px;
            padding: 20px 40px;
            background-color: rgb(225, 225, 19);
            color: rgb(196, 33, 33);
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 15px;
        }
        input[type="submit"]:disabled
        {
              background-color: #cccccc;
              color: #ededed;
              cursor: not-allowed;     
                    opacity: 0.6;
        }

        
              

        small {
    margin-top: 3px;
    display: block;
}

       .hint{
        font-style: 12px;
        color: rgb(47, 6, 91);
        margin-top: 3px;

       }
    </style>
    <script>
        function validateAll()
        { let allValid=true;

    //         document.getElementById("nameError").innerText = "";
    //         document.getElementById("emailError").innerText = "";
    //         document.getElementById("passwordError").innerText = "";
    //         document.getElementById("cityError").innerText = "";
    //         document.getElementById("genderError").innerText = "";
    //         document.getElementById("hobbiesError").innerText = "";
    // let genderSelected = document.querySelector('input[name="gender"]:checked');
    // let hobbiesSelected = document.querySelectorAll('input[name="hobbies"]:checked');



    //       let name = document.getElementById("name").value;
    //       let email = document.getElementById("email").value;
    //       let password = document.getElementById("password").value;
    //       let city = document.getElementById("city").value;
    //       let isValid = true;
        const name = document.getElementById("name").value;
          if(name == ""){
            document.getElementById("nameError").innerText= "name is required";
            allValid = false;
          }
          else if(name.length < 3){
             document.getElementById("nameError").innerText= "name must have atleast 3 characters";
            allValid = false;
          }
          else{
             document.getElementById("nameError").innerText="";
          }
           const email = document.getElementById("email").value;
          if (email == "") 
           {
         document.getElementById("emailError").innerText="Email is required";
        allValid = false;
           }
           else if (!email.includes("@"))
             {
         document.getElementById("emailError").innerText ="email must contain @";
        allValid = false;
            }
            else if(!email.endsWith(".com"))
            {
                document.getElementById("emailError").innerText ="email must contain .com";
                allValid=false;
            }
            else{
                document.getElementById("emailError").innerText ="";
            }
             const password = document.getElementById("password").value;
          if (password == "")
              {
        document.getElementById("passwordError").innerText ="password is required";
        allValid = false;
        
    }
          else if(password.length <8)
          {
            document.getElementById("passwordError").innerText="password must have atleast 8 characters"
          allValid = false;
          }
          else{
            const letters=password.split("").filter(c=>/[a-zA-Z]/.test(c)).length;
            const digits=password.split("").filter(c=>/[0-9]/.test(c)).length;
            const special = password.split('').filter(c => /[^a-zA-Z0-9]/.test(c)).length;
          if(letters <3){ 
          document.getElementById("passwordError").innerText="password must contain atleast 3 alphabet letters(found " + letters + ").";
          allValid=false;
          }
          else if(digits <4){
          document.getElementById("passwordError").innerText="password must contain atleast 4 digits(found "+ digits +").";
          allValid=false;
          }
          else if(special <1)
          {
            document.getElementById("passwordError").innerText="password must contain atleast 1 specail character(found "+ letters +").";
          allValid=false; 
          }
          else{
             document.getElementById("passwordError").innerText="";
          }
        }
           let city = document.getElementById("city").value;
          if (city == "") {
        document.getElementById("cityError").innerText = "Please select a city";
        allValid = false;
           }
           else{
            document.getElementById("cityError").innerText="";
           }
            let genderSelected = document.querySelector('input[name="gender"]:checked');
            if (!genderSelected) {
        document.getElementById("genderError").innerText = "Please select a gender";
        allValid = false;
    }
    else{
        document.getElementById("genderError").innerText="";
    }
    let hobbiesSelected = document.querySelectorAll('input[name="hobbies"]:checked');
    if (hobbiesSelected.length == 0) {
        document.getElementById("hobbiesError").innerText = "Please select at least one hobby";
        allValid = false;
     }
     else{
        document.getElementById("hobbiesError").innerText="";
     }
     document.getElementById("submitBtn").disabled=!allValid;
     return allValid;
    }
    function submitform()
    {
        if(!validateAll())return false;
        const name=document.getElementById("name").value;
        window.location.href = "success.html?name=" + name;
         return false;
    }
    </script>
</head>


<body>
      <div class="container">
    <div class="title">
        <h2><b>STUDENT REGISTRATION FORM</b></h2>
    </div>

    <form action="#" method="get" onsubmit="return submitform()">

        <label>Name:</label>
        <input type="text" name="name" id="name" oninput="validateAll()" placeholder="Exactly 3 characters">
        <small style="font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;color: rgb(248, 73, 19);"id="nameError"></small>

        <label>Email:</label>
        <input type="text" name="email" id="email" oninput="validateAll()" placeholder="example@domain.com">
       <small style="font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;color: rgb(211, 23, 17);" id="emailError"></small>  


        <label>Password:</label>
        <div class="field">
        <input type="password" name="password" id="password" oninput="validateAll()" placeholder="e.g. abc1234!">
         <small style="font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;color: rgb(227, 87, 27);"id="passwordError"></small>
         <div class="hint">8 char:3 letters + 4 digits + 1 special character</div>
         <div class="error" id="password Error"</div>

        <label>City:</label>
        <input type="text" name="city" id="city" oninput="validateAll()" placeholder="Your city"> 
        <small style="font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;color: rgb(211, 13, 13);"id="cityError"></small>

        <label>Gender:</label>
        <div class="option-group">
            <input type="radio" value="Male" name="gender" onchange="validateAll()"> Male
            <input type="radio" value="Female" name="gender" onchange="validateAll()"> Female
            <input type="radio" value="Other" name="gender" onchange="validateAll()"> Other
        </div>
         <small style="font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;color: rgb(178, 17, 17);"id="genderError"></small>

        <label>Hobbies:</label>
        <div class="option">
            <span><input type="checkbox" value="Reading" name="hobbies" onchange="validateAll()"> Reading</span>
            <span><input type="checkbox" value="Sport" name="hobbies" onchange="validateAll()"> Sport</span>
            <span><input type="checkbox" value="Music" name="hobbies" onchange="validateAll()"> Music</span>
            <span><input type="checkbox" value="Coding" name="hobbies" onchange="validateAll()"> Coding</span>
        </div>
         <span style="font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;color: rgb(178, 17, 17);"id="hobbiesError"></span>

        <input type="submit" id=submitBtn value="Submit"disabled>

    </form>
</div>
